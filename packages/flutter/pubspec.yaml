name: horon_ui
description: Flutter port of the Horon design system.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.5

dependencies:
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # 리퀴드 글래스의 굴절과 Flue 배경입니다. `lib/src/glass/glass_shader.dart`가 이 두
  # 경로를 읽고, 테스트가 목록 자체를 검사합니다.
  shaders:
    - shaders/glass_refract.frag
    - shaders/flue.frag
