<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horon Lynx gallery</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="/static/css/client.css" />
    <script type="module" src="/static/js/client.js"></script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f3f4f5;
        font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
      }
      lynx-view {
        display: block;
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>
  <body>
    <lynx-view url="/main.web.bundle"></lynx-view>
    <script type="module">
      // The gallery reads the demo to open from the URL hash or query string,
      // for example `?demo=button` or `#demo=button`. `<lynx-view>` takes that
      // value as `globalProps`, which the bundle reads as
      // `lynx.__globalProps.demo` (the documented way to pass host data in).
      const view = document.querySelector("lynx-view");
      const params = new URLSearchParams(window.location.search || window.location.hash.replace(/^#/, ""));
      const demo = params.get("demo") ?? "";
      const scheme = params.get("scheme") ?? "";
      const platform = params.get("platform") ?? "";
      view.globalProps = { demo, scheme, platform };
    </script>
  </body>
</html>
