name: Publish npm packages

# 두 라이브러리는 같은 버전으로 움직입니다. `v0.1.0` 태그를 밀거나 Actions 탭에서
# 수동으로 실행하면, package.json에 적힌 버전이 아직 npm에 없을 때만 게시합니다.
# 이미 올라간 버전은 건너뛰므로 재실행해도 실패하지 않습니다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance(Sigstore)가 GitHub OIDC로 서명합니다.
  id-token: write

# 두 실행이 동시에 같은 버전을 게시하면 한쪽이 409로 깨집니다.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: publish @horon-ai/tokens, @horon-ai/react
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm publish(provenance)는 npm CLI가 필요합니다. setup-node가
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` 줄이 담긴 .npmrc를 만들고,
      # 그 값은 아래 게시 스텝에서만 주입합니다. 설치 단계 뒤에 두는 이유는 bun이
      # 빈 토큰이 적힌 .npmrc를 읽지 않게 하기 위해서입니다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read and check the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tokens_version=$(node -p "require('./packages/tokens/package.json').version")
          react_version=$(node -p "require('./packages/react/package.json').version")

          if [ -z "$tokens_version" ] || [ "$tokens_version" != "$react_version" ]; then
            echo "::error::@horon-ai/tokens($tokens_version)와 @horon-ai/react($react_version)의 버전이 다릅니다. 두 패키지는 같은 버전으로 게시합니다."
            exit 1
          fi

          # 태그 릴리스라면 태그 이름이 게시 버전과 같아야 합니다. v0.1.0 → 0.1.0
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$tokens_version" ]; then
            echo "::error::태그 $REF_NAME 이 패키지 버전 $tokens_version 과 맞지 않습니다. v$tokens_version 으로 태그하세요."
            exit 1
          fi

          echo "version=$tokens_version" >> "$GITHUB_OUTPUT"
          echo "게시 버전: $tokens_version"

      # 게시 전에 CI와 같은 검사를 다시 돌립니다. 태그가 검증되지 않은 커밋을
      # 가리키더라도 깨진 패키지가 npm에 올라가지 않습니다.
      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::저장소 시크릿 NPM_TOKEN 이 없습니다. npm granular access token을 Settings → Secrets and variables → Actions 에 추가하세요."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/npm-pack"

          # tokens를 먼저 올립니다. react가 @horon-ai/tokens의 같은 버전을 의존하기 때문입니다.
          for name in tokens react; do
            package="@horon-ai/$name"

            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION 은 이미 npm에 있습니다. 건너뜁니다."
              continue
            fi

            # bun pm pack이 `workspace:*` 를 실제 버전(예: 0.1.0)으로 바꿔 tarball을
            # 만듭니다. npm은 workspace 프로토콜을 풀지 못하므로 npm publish에
            # 디렉터리가 아니라 이 tarball을 넘깁니다.
            tarball=$(bun pm pack --cwd "packages/$name" --destination "$RUNNER_TEMP/npm-pack" --quiet)
            echo "packed $tarball"
            npm publish "$tarball" --access public --provenance
          done

      - name: Verify the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in tokens react; do
            package="@horon-ai/$name"
            published=$(npm view "$package@$VERSION" version)
            echo "$package@$published"
          done
