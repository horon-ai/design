name: Publish npm packages

# main에 두 라이브러리의 변경이 올라오면 PATCH 버전을 하나 올려 npm에 게시합니다.
# 버전은 npm 레지스트리가 정본입니다. 처음에는 0.1.0, 그 뒤로 0.1.1, 0.1.2 … 로 올라가고
# package.json의 version(0.1.0)은 MAJOR·MINOR 라인만 정하며 저장소에 다시 커밋하지 않습니다.
# 계산 규칙은 .github/scripts/release-version.mjs에 있습니다.
on:
  push:
    branches: [main]
    paths:
      - "packages/tokens/**"
      - "packages/react/**"
      - "bun.lock"
      - ".github/workflows/publish.yml"
      - ".github/scripts/release-version.mjs"
  workflow_dispatch:

permissions:
  # 게시한 버전에 v0.1.N 태그를 남깁니다.
  contents: write
  # npm trusted publishing과 provenance(Sigstore)가 GitHub OIDC 토큰을 씁니다.
  id-token: write

# 두 실행이 동시에 같은 PATCH를 계산하면 한쪽이 409로 깨집니다. 차례로 돌립니다.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: publish @horon-ai/tokens, @horon-ai/react
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm CLI가 게시를 맡습니다. setup-node가 `_authToken=${NODE_AUTH_TOKEN}` 줄이 담긴
      # .npmrc를 만들므로, bun이 그 파일을 읽지 않도록 설치 단계 뒤에 둡니다.
      # trusted publishing에는 npm 11.5.1 이상이 필요합니다.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@^11.5.1

      # 게시 전에 CI와 같은 검사를 다시 돌립니다. 깨진 패키지는 npm에 올라가지 않습니다.
      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build

      # 검사 뒤에 버전을 적습니다. 테스트가 package.json의 원래 값을 보도록 하기 위해서입니다.
      - name: Choose the next patch version
        id: version
        run: node .github/scripts/release-version.mjs --write

      - name: Publish to npm
        env:
          # 첫 게시에만 필요합니다. 두 패키지에 trusted publisher를 등록한 뒤에는 시크릿을
          # 지워도 OIDC로 게시됩니다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"

          # tokens를 먼저 올립니다. react가 @horon-ai/tokens의 같은 버전을 의존하기 때문입니다.
          for name in tokens react; do
            package="@horon-ai/$name"

            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION 은 이미 npm에 있습니다. 건너뜁니다."
              continue
            fi

            # release-version.mjs --write가 `workspace:*`를 이미 게시 버전으로 바꿔 두었습니다.
            # npm은 workspace 프로토콜을 풀지 못하므로 bun pm pack으로 만든 tarball을 넘깁니다.
            tarball=$(bun pm pack --cwd "packages/$name" --destination "$RUNNER_TEMP/npm-pack" --quiet)
            echo "packed $tarball"
            npm publish "$tarball" --access public --provenance
          done

      - name: Verify the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in tokens react; do
            package="@horon-ai/$name"
            published=$(npm view "$package@$VERSION" version)
            echo "$package@$published"
          done
          npm view "@horon-ai/react@$VERSION" dependencies

      - name: Tag the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag 태그가 이미 있습니다."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
