name: Publish npm packages and deploy the site

# main에 커밋이 올라올 때마다 실행합니다.
#
# 1. publish: 두 라이브러리(packages/tokens, packages/react)가 바뀌었으면 PATCH 버전을 하나
#    올려 npm에 게시합니다. 버전은 npm 레지스트리가 정본입니다. 처음에는 0.1.0, 그 뒤로
#    0.1.1, 0.1.2 … 로 올라가고 package.json의 version(0.1.0)은 MAJOR·MINOR 라인만 정하며
#    저장소에 다시 커밋하지 않습니다. 계산 규칙은 .github/scripts/release-version.mjs에 있습니다.
# 2. site: 방금 게시한 버전(라이브러리가 그대로면 npm의 최신 버전)을 문서 사이트에 npm에서
#    설치해 빌드하고 Cloudflare Pages(horon-design → design.horon.ai)에 배포합니다.
#    Cloudflare의 Git 자동 배포는 이 잡이 꺼 두므로, 사이트는 게시가 끝난 뒤에만 바뀝니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# 권한은 기본으로 읽기만 주고, 필요한 잡에서만 넓힙니다.
permissions:
  contents: read

# 두 실행이 동시에 같은 PATCH를 계산하거나 사이트를 엇갈려 배포하지 않도록 차례로 돌립니다.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  changes:
    name: detect library changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.diff.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 수동 실행은 언제나 게시합니다. push는 이번에 올라온 커밋 범위에 라이브러리 변경이
      # 있을 때만 게시하고, 범위를 알 수 없으면(새 브랜치, 강제 푸시) 게시 쪽으로 판단합니다.
      - name: Compare the pushed range
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            packages/tokens packages/react bun.lock \
            .github/workflows/publish.yml .github/scripts/release-version.mjs)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "라이브러리 변경이 없습니다. 게시를 건너뛰고 사이트만 배포합니다."
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: publish @horon-ai/tokens, @horon-ai/react
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      # 게시한 버전에 v0.1.N 태그를 남깁니다.
      contents: write
      # npm trusted publishing과 provenance(Sigstore)가 GitHub OIDC 토큰을 씁니다.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm CLI가 게시를 맡습니다. setup-node가 `_authToken=${NODE_AUTH_TOKEN}` 줄이 담긴
      # .npmrc를 만들므로, bun이 그 파일을 읽지 않도록 설치 단계 뒤에 둡니다.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # trusted publishing과 provenance에는 npm 11.5.1 이상이 필요합니다. Node 24에 딸린
      # npm으로 충분하므로 따로 설치하지 않고 버전만 확인합니다.
      - name: Check npm version
        run: |
          set -euo pipefail
          version=$(npm --version)
          echo "npm $version"
          if [ "$(printf '%s\n' 11.5.1 "$version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $version 은 trusted publishing을 지원하지 않습니다(11.5.1 이상 필요)."
            exit 1
          fi

      # 게시 전에 CI와 같은 검사를 다시 돌립니다. 깨진 패키지는 npm에 올라가지 않습니다.
      - name: Verify
        run: |
          bun run lint
          bun run typecheck
          bun test
          bun run build

      # 검사 뒤에 버전을 적습니다. 테스트가 package.json의 원래 값을 보도록 하기 위해서입니다.
      - name: Choose the next patch version
        id: version
        run: node .github/scripts/release-version.mjs --write

      - name: Publish to npm
        env:
          # 첫 게시에만 필요합니다. 두 패키지에 trusted publisher를 등록한 뒤에는 시크릿을
          # 지워도 OIDC로 게시됩니다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-pack"

          # tokens를 먼저 올립니다. react가 @horon-ai/tokens의 같은 버전을 의존하기 때문입니다.
          for name in tokens react; do
            package="@horon-ai/$name"

            if npm view "$package@$VERSION" version >/dev/null 2>&1; then
              echo "$package@$VERSION 은 이미 npm에 있습니다. 건너뜁니다."
              continue
            fi

            # release-version.mjs --write가 `workspace:*`를 이미 게시 버전으로 바꿔 두었습니다.
            # npm은 workspace 프로토콜을 풀지 못하므로 bun pm pack으로 만든 tarball을 넘깁니다.
            tarball=$(bun pm pack --cwd "packages/$name" --destination "$RUNNER_TEMP/npm-pack" --quiet)
            echo "packed $tarball"
            npm publish "$tarball" --access public --provenance
          done

      - name: Verify the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for name in tokens react; do
            package="@horon-ai/$name"
            published=$(npm view "$package@$VERSION" version)
            echo "$package@$published"
          done
          npm view "@horon-ai/react@$VERSION" dependencies

      # 체크아웃이 자격 증명을 남기지 않으므로 태그는 GitHub API로 만듭니다.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag 태그가 이미 있습니다."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          echo "$tag → $GITHUB_SHA"

  site:
    name: deploy design.horon.ai with the published packages
    needs: [changes, publish]
    # 게시를 건너뛴 실행(사이트만 바뀐 커밋)도 배포하고, 게시가 실패하면 배포하지 않습니다.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: horon-design
    steps:
      - name: Check Cloudflare credentials
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::저장소 시크릿 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID가 필요합니다. 토큰 권한은 Account → Cloudflare Pages → Edit입니다."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # 방금 게시한 버전, 게시를 건너뛰었으면 npm의 latest를 씁니다.
      - name: Choose the published version
        id: version
        env:
          PUBLISHED: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          version="${PUBLISHED:-}"
          if [ -z "$version" ]; then
            version=$(npm view @horon-ai/react version 2>/dev/null || true)
          fi
          if [ -z "$version" ]; then
            echo "::error::npm에 @horon-ai/react가 아직 없습니다. 라이브러리를 먼저 게시하세요(Actions 탭에서 이 워크플로 수동 실행)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "사이트에 설치할 버전: $version"

      - name: Install the published packages into the site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/site-use-published.mjs "$VERSION"
          bun install
          # 저장소 폴더가 아니라 npm에서 받은 그 버전인지 확인합니다.
          for name in react tokens; do
            dir=$(cd "apps/site/node_modules/@horon-ai/$name" && pwd -P)
            installed=$(node -p "require('$dir/package.json').version")
            echo "@horon-ai/$name@$installed ← $dir"
            case "$dir" in
              "$GITHUB_WORKSPACE/packages/"*) echo "::error::@horon-ai/$name이 저장소 폴더로 연결됐습니다."; exit 1 ;;
            esac
            if [ "$installed" != "$VERSION" ]; then
              echo "::error::@horon-ai/$name이 $VERSION이 아니라 $installed로 설치됐습니다."
              exit 1
            fi
          done

      - name: Build the site
        run: bun run build:site

      # Cloudflare Pages의 Git 연동은 main 푸시마다 저장소 소스로 사이트를 따로 빌드합니다.
      # 그 빌드가 이 배포를 덮지 않도록 프로덕션 자동 배포를 꺼 둡니다. 이미 꺼져 있으면 그대로 둡니다.
      - name: Keep Cloudflare Git production builds off
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          enabled=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const c=JSON.parse(s).result?.source?.config;console.log(c?c.production_deployments_enabled:"none")})')
          echo "Git production deployments: $enabled"
          if [ "$enabled" = "true" ]; then
            curl -fsS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json" \
              -d '{"source":{"config":{"production_deployments_enabled":false}}}' "$api" >/dev/null
            echo "Git production deployments를 껐습니다."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bunx wrangler@4 pages deploy apps/site/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="site with @horon-ai/react@$VERSION" \
            --commit-dirty=true
