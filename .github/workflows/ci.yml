name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  flutter:
    name: flutter analyze / format / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example

      - name: Test
        run: flutter test

      # `flutter test`는 패키지 루트만 돌립니다. `example/`은 별도 패키지라
      # 갤러리 회귀 테스트가 여기서 따로 돌지 않으면 CI에서 한 번도 실행되지
      # 않습니다. 갤러리는 이 계획의 유일한 시각 검증 창구이므로 함께 돌립니다.
      - name: Test the gallery
        working-directory: packages/flutter/example
        run: |
          flutter pub get
          flutter test
